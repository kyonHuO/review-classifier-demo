<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f5f8">
<title>ページが見つかりません｜Nagiport</title>
<style>
  :root{--ink:#121217;--sub:#5f5866;--bg:#f6f5f8;--accent:#8e73b0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.9;display:flex;min-height:100svh;align-items:center;justify-content:center;padding:24px}
  main{max-width:560px;width:100%}
  .eyebrow{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:#8b799f;margin:0 0 12px}
  h1{font-size:clamp(26px,6vw,38px);font-weight:600;line-height:1.5;letter-spacing:-.03em;margin:0 0 14px}
  p{font-size:14px;color:var(--sub);margin:0 0 24px}
  a.home{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-size:13px;padding:13px 20px;border-radius:6px}
  a.home:hover{background:#7c619e}
  footer{margin-top:32px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#a293ac}
</style>
</head>
<body>
<main>
  <p class="eyebrow">404 / NOT FOUND</p>
  <h1>ページが見つかりません</h1>
  <p>URLが変わったか、ページがまだ公開されていない可能性があります。トップページからたどり直してください。</p>
  <a class="home" href="/">トップへ戻る <span aria-hidden="true">&nearr;</span></a>
  <footer>NAGIPORT</footer>
</main>
</body>
</html>
