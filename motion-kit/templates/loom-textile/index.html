<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23555'/%3E%3C/svg%3E"><title>LOOM / 色を織る — 織物配色ラボ</title><link rel="stylesheet" href="styles.css"></head><body><a class="skip" href="#main">本文へ</a><header><a href="../index.html">L / L</a><span>TEXTILE EXPERIMENTS<br>色を織る、小さな実験室。</span><span>COLLECTION 003</span></header><main id="main"><section class="fabric"><canvas id="weave" aria-label="選択した糸色による拡大織物">選択色の織物。配色名と織り方は操作欄に表示します。</canvas><div class="fabric-index">WOVEN<br>IN COLOUR.</div><h1>lo<span>o</span>m.</h1><div class="sample-tag"><span>SWATCH / 01</span><b id="palette-name">ROSE / INK</b><span>経糸と緯糸が出会う、その表情。</span></div></section><section class="workbench"><div class="intro"><span>MAKE YOUR COLOUR</span><h2>一本ずつ、<br><i>あなたの色へ。</i></h2></div><div class="settings"><fieldset><legend>糸の組み合わせ</legend><div class="swatches"><button data-palette="0" aria-pressed="true"><i style="--a:#bd2647;--b:#f5aeba"></i>ROSE / INK</button><button data-palette="1" aria-pressed="false"><i style="--a:#17534b;--b:#e8cc70"></i>FOREST / SUN</button><button data-palette="2" aria-pressed="false"><i style="--a:#3445a1;--b:#eaa56f"></i>BLUE / CLAY</button></div></fieldset><div class="adjust"><label for="density">織りの密度 <output id="density-value">10 px</output></label><input id="density" type="range" min="5" max="18" value="10"><div class="patterns"><button data-pattern="plain" aria-pressed="true">平織り</button><button data-pattern="twill" aria-pressed="false">綾織り</button></div><p id="weave-description" role="status">ROSE / INK — 平織り。糸が交互に交差します。</p></div></div></section></main><footer><span>LOOM / 色を織る © 2026</span><span>架空のデモ。注文・予約・外部送信は行いません。</span><a href="README.md">使い方 / MIT</a></footer><script src="script.js"></script></body></html>
